# Workflow for building and deploying this PWA to GitHub Pages, in the shape the
# Pages template ships: a build job and a deploy job that needs it, the three
# official Pages actions, and one concurrent "pages" deployment that is never
# cancelled while it is running.
name: Deploy guantanamera with GitHub Pages dependencies preinstalled

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # A tagged push is a release: it redeploys the site and, unlike a plain push,
  # it keeps www/config.json, so installed apps may update to it.
  tags: ["v*"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Build job
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      # Jekyll builds from a gem the runner already has; this app builds from npm,
      # so Node is the one step the template does not need and we do.
      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      # The anti-hallucination gate: an invented widget or prop, a positional
      # widget call, a foreign-framework import. A red build here is cheaper than
      # a live page that renders a broken layout.
      - name: Check app API usage (npm run check)
        run: npm run check

      # `flet-box createBundle www` — the whole app becomes one hashed bundle plus
      # the copied assets the manifest lists.
      - name: Build site (npm run build)
        run: npm run build

      # www/config.json is the OTA manifest: an installed app fetches it and
      # compares its `hash` with the bundle it runs. Publishing it from an ordinary
      # push would offer that unfinished build to every device that checks for
      # updates, so only a release tag ships it. The site itself deploys either
      # way; a missing manifest reads as "no update published yet".
      - name: Keep the update feed on releases only
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        run: rm -f www/config.json

      - name: Print the address
        run: |
          owner=$(printf '%s' "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')
          echo "  site:    https://$owner.github.io/${GITHUB_REPOSITORY#*/}/"
          echo "  If that 404s after a green run: Settings -> Pages -> Source = GitHub Actions"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: www

  # Deployment job
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
