name: Build guantanamera — native (manual)

# Nothing in here runs on a push. Start it by hand: Actions -> "guantanamera —
# native (manual)" -> Run workflow, then pick the platform. Each job bundles the
# web first, because that bundle is what Capacitor copies into the app.

on:
  workflow_dispatch:
    inputs:
      platform:
        description: "What to build"
        type: choice
        options:
          - android
          - ios
          - both
        default: android

permissions:
  contents: read

jobs:
  # ---------- ANDROID: debug APK ----------
  android:
    name: Android (APK)
    if: inputs.platform == 'android' || inputs.platform == 'both'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      # ubuntu runners ship the Android SDK; this step accepts licences and
      # installs any packages the Capacitor Gradle build asks for.
      - uses: android-actions/setup-android@v4

      - name: Install dependencies
        run: npm install

      - name: Bundle web app
        run: npm run build

      - name: Add Android platform
        run: npx cap add android

      - name: Sync web assets to Android
        run: npx cap sync android

      - name: Build debug APK
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v6
        with:
          name: guantanamera-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      # An artifact has no public URL: it is on the run page, and this prints
      # which run. The debug APK installs as it is; a release one would have to be
      # signed with your own keystore first.
      - name: Where the APK is
        run: |
          echo "  artifact: guantanamera-android-debug"
          echo "  download: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          echo "::notice title=APK ready::guantanamera-android-debug, on this run page"

  # ---------- iOS: simulator build ----------
  ios:
    name: iOS (simulator)
    if: inputs.platform == 'ios' || inputs.platform == 'both'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Bundle web app
        run: npm run build

      - name: Add iOS platform
        run: npx cap add ios

      - name: Sync web assets to iOS
        run: npx cap sync ios

      - name: Install CocoaPods
        run: |
          cd ios/App
          pod install --repo-update

      # Signed device/App Store builds need your Apple certificates; CI here
      # builds an unsigned simulator app so no secrets are required.
      - name: Build for simulator
        run: |
          cd ios/App
          xcodebuild \
            -workspace App.xcworkspace \
            -scheme App \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Upload .app
        uses: actions/upload-artifact@v6
        with:
          name: guantanamera-ios-simulator
          path: ios/App/build/Build/Products/Debug-iphonesimulator/App.app
          if-no-files-found: error

      - name: Where the build is
        run: |
          echo "  artifact: guantanamera-ios-simulator"
          echo "  download: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          echo "::notice title=Simulator build ready::guantanamera-ios-simulator, on this run page"
